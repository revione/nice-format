<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formatter</title>
    <style>
      body.dark {
        background-color: #1a1a1a;
        color: #e0e0ea;
      }

      body {
        background-color: #2effbb08;

        font-size: 24px;
        line-height: 1.5rem;
        font-family: sans-serif;
        font-weight: 300;

        display: flex;
        flex-direction: column;
        gap: 15px;

        margin: 0;
        margin-top: 4vh;
        margin-bottom: 100vh;

        align-items: center;
        min-height: 100vh;
      }
      .formatter {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 10px;
        box-sizing: border-box;
        resize: both;
        width: 70%;

        /* crece con el texto en vez de recortarlo a 80vh */
        min-height: 80vh;
        height: auto;

        /* si lo redimensionas mas pequeno, se desplaza en vez de ocultar */
        overflow: auto;
        overflow-wrap: anywhere;
      }
      .formatter:not([contenteditable]) {
        cursor: default;
      }

      /* nada de lo que pegues puede salirse de la caja */
      .formatter * {
        max-width: 100% !important;
        overflow-wrap: anywhere !important;
        box-sizing: border-box;
      }

      /* texto preformateado: respeta los saltos pero envuelve */
      .formatter pre,
      .formatter code,
      .formatter [style*="white-space"],
      .formatter [style*="nowrap"] {
        white-space: pre-wrap !important;
      }

      .formatter img,
      .formatter svg,
      .formatter video {
        height: auto !important;
      }

      .formatter table {
        width: 100% !important;
        table-layout: fixed !important;
      }

      p,
      div {
        background: transparent !important;
        color: unset !important;
      }
    </style>
  </head>

  <script>
    const app = () => {
      const formatter = document.getElementById("formatter");

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          formatter.toggleAttribute("contenteditable");
        }
        if (event.key === "1" && event.metaKey) {
          event.preventDefault();
          document.body.classList.toggle("dark");
        }
      });
    };

    document.addEventListener("DOMContentLoaded", app);
  </script>

  <body>
    <div id="formatter" class="formatter" contenteditable="true">
      Escribe...
    </div>
  </body>
</html>
