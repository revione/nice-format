<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formatter</title>
    <style>
      /* Paletas de lectura. Las seis dan como minimo 7:1 de contraste
         entre texto y hoja (WCAG AAA) sin llegar al 21:1 del negro puro
         sobre blanco puro, que cansa la vista. Las oscuras usan un casi
         negro, no #000, que produce halo y parpadeo en OLED.
         Estos valores son el tema Papel; el JS los reescribe. */
      :root {
        --pagina: #f1f0ea;
        --hoja: #faf9f5;
        --texto: #2e2e2e;
        --borde: #dcdad3;
        --seleccion: #d5d3cd;
        --asa: #c8c6c0;
      }

      ::selection {
        background-color: var(--seleccion);
      }

      body {
        background-color: var(--pagina);
        color: var(--texto);
        color-scheme: light;

        font-size: 24px;
        line-height: 1.5rem;
        font-family: sans-serif;
        font-weight: 300;

        display: flex;
        flex-direction: column;
        gap: 15px;

        margin: 0;
        margin-top: max(4vh, 56px); /* deja libre la barra fija de arriba */
        margin-bottom: 100vh;

        align-items: center;
        min-height: 100vh;
      }

      /* mientras arrastras una asa no se selecciona texto sin querer */
      body.arrastrando {
        user-select: none;
      }

      /* El marco es lo que se mueve y se ensancha; el ancho vive aqui
         para que las asas queden pegadas a los bordes reales. */
      /* Los dos marcos van en una fila centrada. Cada uno lleva su
         propio ancho, su propio alto y su propio desplazamiento: son
         independientes, la fila solo los mantiene juntos y separados. */
      .fila {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: var(--separacion, 22px);
        width: 100%;
      }
      .marco {
        position: relative;
        flex: 0 0 auto;
        width: var(--ancho, 70%);
        max-width: 100%;
        transform: translateX(var(--desplazamiento, 0px));
      }

      .formatter {
        /* 1.6 de interlineado y 24px son los valores de partida
           recomendados para lectura; se ajustan desde la barra */
        font-size: var(--fuente, 24px);
        line-height: var(--interlineado, 1.6);

        background-color: var(--hoja);
        color: var(--texto);
        caret-color: var(--texto);
        border-radius: 4px;
        padding: 10px;
        box-sizing: border-box;

        /* crece con el texto en vez de recortarlo a 80vh */
        min-height: 80vh;
        height: auto;

        /* si lo achicas con el asa, se desplaza en vez de ocultar */
        overflow: auto;
        overflow-wrap: anywhere;
      }
      .formatter:not([contenteditable]) {
        cursor: default;
      }

      /* nada de lo que pegues puede salirse de la caja */
      .formatter * {
        overflow-wrap: anywhere !important;
        box-sizing: border-box;
      }
      .formatter div,
      .formatter p,
      .formatter pre,
      .formatter blockquote,
      .formatter table,
      .formatter img,
      .formatter svg,
      .formatter video {
        max-width: 100% !important;
      }

      /* Los colores de lectura se imponen SOLO en los bloques, nunca en
         los elementos inline: los lectores de voz (Natural Reader)
         resaltan la frase y la palabra envolviendolas en <span> con
         fondo propio, y un background transparente global se los borra. */
      .formatter div,
      .formatter p {
        background: transparent !important;
        color: unset !important;
      }

      /* lo pegado obedece a la fuente y el interlineado elegidos;
         los titulos conservan su tamano relativo (van en em) */
      .formatter * {
        font-family: inherit !important;
        line-height: inherit !important;
      }
      .formatter *:not(h1):not(h2):not(h3):not(h4):not(h5):not(h6) {
        font-size: inherit !important;
      }

      /* texto preformateado: respeta los saltos pero envuelve */
      .formatter pre,
      .formatter code,
      .formatter [style*="white-space"],
      .formatter [style*="nowrap"] {
        white-space: pre-wrap !important;
      }

      .formatter img,
      .formatter svg,
      .formatter video {
        height: auto !important;
      }

      .formatter table {
        width: 100% !important;
        table-layout: fixed !important;
      }

      /* --- Asas: bandas invisibles justo por fuera de cada borde --- */
      .asa {
        position: absolute;
        border-radius: 4px;
        background-color: transparent;
        transition: background-color 0.15s ease;
        touch-action: none;
      }
      .asa:hover,
      .asa.activa {
        background-color: var(--asa);
      }

      .asa-izq,
      .asa-der {
        top: 0;
        bottom: 0;
        width: 12px;
        cursor: ew-resize;
      }
      .asa-izq {
        left: -6px;
      }
      .asa-der {
        right: -6px;
      }

      .asa-abajo {
        left: 0;
        right: 0;
        bottom: -6px;
        height: 12px;
        cursor: ns-resize;
      }

      /* Solo desplaza a los lados, no flota: no cambia el alto ni la
         posicion vertical. */
      .asa-mover {
        left: 0;
        right: 0;
        top: -6px;
        height: 12px;
        cursor: grab;
      }
      .asa-mover.activa {
        cursor: grabbing;
      }

      /* --- Notas: la hoja de al lado, con su propio marco --- */
      .notas {
        width: 100%;
        height: 80vh;
        min-height: 80vh;
        box-sizing: border-box;
        overflow: auto;
        resize: none;
        border: 0;
        outline: none;
        border-radius: 4px;
        padding: 10px;

        background-color: var(--hoja);
        color: var(--texto);
        caret-color: var(--texto);

        font-family: sans-serif;
        font-weight: 300;
        font-size: var(--fuente, 24px);
        line-height: var(--interlineado, 1.6);
      }
      .notas:read-only {
        cursor: default;
      }

      /* --- Barra de estado --- */
      .barra {
        position: fixed;
        top: 10px;
        right: 12px;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        max-width: calc(100vw - 24px);
        align-items: center;
        gap: 8px;
        z-index: 10;
        font-size: 13px;
        font-family: sans-serif;
      }
      .chip {
        background-color: var(--hoja);
        color: var(--texto);
        border: 1px solid var(--borde);
        border-radius: 999px;
        padding: 5px 11px;
        line-height: 1;
        opacity: 0.7;
        transition: opacity 0.15s ease;
      }
      .chip:hover {
        opacity: 1;
      }
      button.chip {
        cursor: pointer;
        font-size: 14px;
      }

      /* --- Panel de colores --- */
      /* el display de autor gana al [hidden] del navegador */
      [hidden] {
        display: none !important;
      }
      .panel {
        position: fixed;
        top: 48px;
        right: 12px;
        z-index: 11;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border-radius: 10px;
        background-color: var(--hoja);
        color: var(--texto);
        border: 1px solid var(--borde);
        box-shadow: 0 8px 24px rgb(0 0 0 / 18%);
        font-size: 13px;
        font-family: sans-serif;
      }
      .muestras {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .muestra {
        width: 58px;
        height: 40px;
        border-radius: 6px;
        border: 2px solid transparent;
        cursor: pointer;
        font-family: serif;
        font-size: 15px;
      }
      .muestra[aria-pressed="true"] {
        border-color: currentColor;
      }
      .color-fila {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .color-fila input[type="color"] {
        width: 34px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--borde);
        border-radius: 4px;
        background: none;
        cursor: pointer;
      }
      .grupo {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .grupo button {
        background: none;
        border: 0;
        padding: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .grupo b {
        font-weight: 500;
        min-width: 2.6em;
        text-align: center;
        cursor: pointer;
      }
      .grupo input[type="range"] {
        width: 92px;
        margin: 0;
        accent-color: currentColor;
        cursor: pointer;
      }
    </style>
  </head>

  <script>
    const app = () => {
      const fila = document.getElementById("fila");
      const formatter = document.getElementById("formatter");
      const botonTema = document.getElementById("tema");
      const chipModo = document.getElementById("modo");
      const panel = document.getElementById("panel");
      const areaNotas = document.getElementById("texto-notas");
      const entradas = {
        pagina: document.getElementById("c-pagina"),
        hoja: document.getElementById("c-hoja"),
        texto: document.getElementById("c-texto"),
      };

      const CLAVE = "withDiv:preferencias";
      const ANCHO_MIN = 240;
      const ALTO_MIN = 120;
      const SEPARACION = 22; // el hueco entre los dos marcos, en px
      const HUECO_MIN = 12; // lo minimo que pueden acercarse al moverse
      const MARGEN = 28; // aire a los lados que la colocacion automatica
      // nunca se come; arrastrando a mano si se puede llegar al borde

      // ajustes tipograficos de la barra
      const AJUSTES = {
        fuente: { def: 24, min: 12, max: 48, paso: 1, unidad: "px", dec: 0 },
        interlineado: { def: 1.6, min: 1, max: 2.4, paso: 0.1, unidad: "", dec: 1 },
      };

      const leer = () => {
        try {
          return JSON.parse(localStorage.getItem(CLAVE)) || {};
        } catch {
          return {};
        }
      };

      const prefs = leer();

      // La posicion lateral no se conserva: el cuadro arranca siempre
      // centrado. Mover y, sobre todo, ensanchar por un borde dejan un
      // desplazamiento que no tiene sentido heredar en la carga.
      // cada marco guarda su ancho y su alto aparte
      prefs.paneles = prefs.paneles || {};
      prefs.paneles.lectura = prefs.paneles.lectura || {};
      prefs.paneles.notas = prefs.paneles.notas || {};
      if (prefs.ancho) prefs.paneles.lectura.ancho = prefs.ancho;
      if (prefs.alto) prefs.paneles.lectura.alto = prefs.alto;
      delete prefs.ancho;
      delete prefs.alto;
      delete prefs.reparto;

      // antes solo habia claro/oscuro; se traduce al tema equivalente
      if (!prefs.tema) prefs.tema = prefs.oscuro ? "noche" : "papel";
      delete prefs.oscuro;
      delete prefs.anchoNotas; // sobra desde que las notas van al lado

      // la posicion lateral no se guarda: los marcos arrancan centrados
      const guardar = () => {
        try {
          const copia = { ...prefs, paneles: {} };
          Object.entries(prefs.paneles).forEach(([id, ajuste]) => {
            const { desplazamiento, ...resto } = ajuste;
            copia.paneles[id] = resto;
          });
          localStorage.setItem(CLAVE, JSON.stringify(copia));
        } catch {}
      };

      const PANELES = {
        lectura: {
          id: "lectura",
          lado: "izq",
          marco: document.getElementById("marco-lectura"),
          hoja: formatter,
        },
        notas: {
          id: "notas",
          lado: "der",
          marco: document.getElementById("marco-notas"),
          hoja: areaNotas,
        },
      };

      const ajustes = (panel) => prefs.paneles[panel.id];
      const visible = (panel) => !panel.marco.hidden;
      const vecinoDe = (panel) =>
        panel.id === "lectura" ? PANELES.notas : PANELES.lectura;

      const anchoDisponible = () => document.documentElement.clientWidth;

      // ancho de trabajo: la ventana menos el aire de los lados
      const anchoUtil = () => anchoDisponible() - MARGEN * 2;

      // el tope de cada marco descuenta lo que ocupa el otro, asi la
      // fila nunca desborda ni se pega a los bordes
      const fijarAncho = (panel, deseado) => {
        const vecino = vecinoDe(panel);
        const ocupado = visible(vecino)
          ? vecino.marco.getBoundingClientRect().width + SEPARACION
          : 0;
        const tope = Math.max(ANCHO_MIN, anchoUtil() - ocupado);
        const ancho = Math.round(Math.min(Math.max(deseado, ANCHO_MIN), tope));
        ajustes(panel).ancho = ancho;
        panel.marco.style.setProperty("--ancho", ancho + "px");
        return ancho;
      };

      const fijarAlto = (panel, deseado) => {
        const alto = Math.round(Math.max(deseado, ALTO_MIN));
        ajustes(panel).alto = alto;
        // el min-height por defecto es 80vh, hay que bajarlo tambien
        panel.hoja.style.height = alto + "px";
        panel.hoja.style.minHeight = alto + "px";
      };

      // Cada marco se queda dentro de la ventana y dentro de su lado:
      // el de la izquierda no cruza al de la derecha ni al reves.
      const fijarDesplazamiento = (panel, deseado) => {
        const actual = ajustes(panel).desplazamiento || 0;
        const caja = panel.marco.getBoundingClientRect();
        const centrado = caja.left - actual;

        let min = -centrado;
        let max = anchoDisponible() - caja.width - centrado;

        const vecino = vecinoDe(panel);
        if (visible(vecino) && visible(panel)) {
          const otro = vecino.marco.getBoundingClientRect();
          if (panel.lado === "izq") {
            max = Math.min(max, otro.left - HUECO_MIN - caja.width - centrado);
          } else {
            min = Math.max(min, otro.right + HUECO_MIN - centrado);
          }
        }

        const valor = Math.round(Math.min(Math.max(deseado, min), max));
        ajustes(panel).desplazamiento = valor;
        panel.marco.style.setProperty("--desplazamiento", valor + "px");
      };

      const pintarPanel = (panel) => {
        const ajuste = ajustes(panel);
        panel.marco.style.setProperty(
          "--ancho",
          ajuste.ancho ? ajuste.ancho + "px" : "70%"
        );
        panel.marco.style.setProperty(
          "--desplazamiento",
          (ajuste.desplazamiento || 0) + "px"
        );
        panel.hoja.style.height = ajuste.alto ? ajuste.alto + "px" : "";
        panel.hoja.style.minHeight = ajuste.alto ? ajuste.alto + "px" : "";
      };

      const anchoPorDefecto = () => Math.round(anchoDisponible() * 0.7);

      // Con los dos marcos abiertos, conserva sus anchos si caben en el
      // ancho util y si no los encoge en la misma proporcion. Corre en
      // cada pintado, no solo al pulsar el boton: si no, un estado
      // guardado con las notas abiertas se salia de la ventana.
      const encajar = () => {
        if (!visible(PANELES.notas)) return;

        const lectura = ajustes(PANELES.lectura);
        const notas = ajustes(PANELES.notas);
        const sitio = anchoUtil() - SEPARACION;

        // ventana muy estrecha: mitad y mitad, sin suelo minimo
        if (sitio < ANCHO_MIN * 2) {
          lectura.ancho = notas.ancho = Math.max(80, Math.round(sitio / 2));
          return;
        }

        const anchoLectura = lectura.ancho || anchoPorDefecto();
        const anchoNotas = notas.ancho || Math.round(anchoLectura * 0.55);
        const factor = Math.min(1, sitio / (anchoLectura + anchoNotas));

        lectura.ancho = Math.max(ANCHO_MIN, Math.round(anchoLectura * factor));
        notas.ancho = Math.max(ANCHO_MIN, Math.round(anchoNotas * factor));
      };

      const pintarNotas = () => {
        PANELES.notas.marco.hidden = !prefs.notasAbiertas;
        fila.style.setProperty("--separacion", SEPARACION + "px");
        encajar();
        Object.values(PANELES).forEach(pintarPanel);
      };

      const fijarAjuste = (nombre, valor) => {
        const ajuste = AJUSTES[nombre];
        const acotado = Math.min(Math.max(valor, ajuste.min), ajuste.max);
        prefs[nombre] = Number(acotado.toFixed(ajuste.dec));
        // en la raiz, no en el cuadro: las notas usan los mismos valores
        document.documentElement.style.setProperty(
          "--" + nombre,
          prefs[nombre] + ajuste.unidad
        );
        document.getElementById("valor-" + nombre).textContent =
          prefs[nombre].toFixed(ajuste.dec);
      };

      const pintarModo = () => {
        if (document.activeElement === areaNotas) {
          chipModo.textContent = areaNotas.readOnly ? "notas fijas" : "notas";
          return;
        }
        chipModo.textContent = formatter.hasAttribute("contenteditable")
          ? "edición"
          : "div";
      };

      const aplicar = () => {
        Object.keys(AJUSTES).forEach((nombre) =>
          fijarAjuste(nombre, prefs[nombre] ?? AJUSTES[nombre].def)
        );
        fijarMaxChar(prefs.maxChar ?? MAX_CHAR_DEF);
        pintarPaleta();
        pintarNotas();
        // solo si difiere: reasignar el value mueve el cursor al final
        const texto = prefs.textoNotas || "";
        if (areaNotas.value !== texto) areaNotas.value = texto;
        pintarModo();
      };

      // La fila esta centrada, asi que cambiar el ancho de un marco
      // recoloca a los dos. Se compensa en ambos para que solo se mueva
      // el borde que estas arrastrando y el otro marco no se inmute.
      const redimensionar = (panel, d, anchoNuevo, bordeFijo) => {
        const ancho = fijarAncho(panel, anchoNuevo);
        const delta = ancho - d.ancho;

        fijarDesplazamiento(
          panel,
          d.off + (bordeFijo === "izq" ? delta / 2 : -delta / 2)
        );

        const vecino = vecinoDe(panel);
        if (visible(vecino)) {
          fijarDesplazamiento(
            vecino,
            d.offVecino + (panel.lado === "izq" ? -delta / 2 : delta / 2)
          );
        }
      };

      const gestos = {
        izq: (panel, d) => redimensionar(panel, d, d.ancho - d.dx, "der"),
        der: (panel, d) => redimensionar(panel, d, d.ancho + d.dx, "izq"),
        abajo: (panel, d) => fijarAlto(panel, d.alto + d.dy),
        mover: (panel, d) => fijarDesplazamiento(panel, d.off + d.dx),
      };

      document.querySelectorAll(".asa").forEach((asa) => {
        const gesto = gestos[asa.dataset.asa];
        const panel = PANELES[asa.closest(".marco").dataset.panel];

        asa.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          asa.setPointerCapture(event.pointerId);
          asa.classList.add("activa");
          document.body.classList.add("arrastrando");

          const inicio = {
            x: event.clientX,
            y: event.clientY,
            ancho: panel.marco.getBoundingClientRect().width,
            alto: panel.hoja.getBoundingClientRect().height,
            off: ajustes(panel).desplazamiento || 0,
            offVecino: ajustes(vecinoDe(panel)).desplazamiento || 0,
          };

          const mover = (e) =>
            gesto(panel, {
              ...inicio,
              dx: e.clientX - inicio.x,
              dy: e.clientY - inicio.y,
            });

          const soltar = () => {
            asa.classList.remove("activa");
            document.body.classList.remove("arrastrando");
            asa.removeEventListener("pointermove", mover);
            asa.removeEventListener("pointerup", soltar);
            asa.removeEventListener("pointercancel", soltar);
            guardar();
          };

          asa.addEventListener("pointermove", mover);
          asa.addEventListener("pointerup", soltar);
          asa.addEventListener("pointercancel", soltar);
        });

        // doble clic: ese marco vuelve a su tamano y sitio original
        asa.addEventListener("dblclick", () => {
          prefs.paneles[panel.id] = {};
          pintarPanel(panel);
          // con los dos abiertos el 70% de partida desbordaria la fila,
          // asi que se acota a lo que deje libre el otro marco
          if (visible(PANELES.notas)) {
            fijarAncho(panel, panel.marco.getBoundingClientRect().width);
          }
          fijarDesplazamiento(panel, 0);
          guardar();
        });
      });

      // --- Separar en parrafos ---
      // misma logica que remove-lines-and-separate-by-dots.html: junta
      // todas las lineas en una sola y luego corta por el punto mas
      // cercano al limite de caracteres.
      const MAX_CHAR_DEF = 10;
      const deslizador = document.getElementById("maxChar");
      const valorMaxChar = document.getElementById("valor-maxChar");
      let yaSeparado = false;
      let deshacerSeparar = null; // contenido previo, para el Cmd+Z

      const fijarMaxChar = (valor) => {
        const numero = Number(valor);
        // un valor guardado de un rango anterior se descarta en vez de
        // quedar acotado a medias: el numero y el tirador iban por libre
        const fuera =
          !Number.isFinite(numero) ||
          numero < Number(deslizador.min) ||
          numero > Number(deslizador.max);

        deslizador.value = fuera ? MAX_CHAR_DEF : numero;
        // se relee del control, que ya ajusta al min, al max y al paso
        prefs.maxChar = Number(deslizador.value);
        valorMaxChar.textContent = prefs.maxChar;
      };

      const quitarSaltos = (texto) =>
        texto
          .split("\n")
          .map((linea) => linea.trim() + " ")
          .join("");

      // misma logica que splitTextByDelimiters de separar-2.html: corta
      // por el punto o la coma mas cercanos al limite de caracteres
      const separarPorDelimitadores = (texto, maxChar) => {
        const parrafos = [];
        let inicio = 0;

        while (inicio < texto.length) {
          let fin = inicio + maxChar;

          if (fin >= texto.length) {
            parrafos.push(texto.substring(inicio));
            break;
          }

          const anterior = Math.max(
            texto.lastIndexOf(".", fin),
            texto.lastIndexOf(",", fin)
          );

          if (anterior > inicio) {
            fin = anterior + 1;
          } else {
            // no hay delimitador antes del limite: se busca el siguiente
            const siguiente = (caracter) => {
              const donde = texto.indexOf(caracter, fin);
              return donde === -1 ? Infinity : donde + 1;
            };
            const proximo = Math.min(siguiente("."), siguiente(","));

            if (proximo !== Infinity && proximo > inicio) {
              fin = proximo;
            } else {
              // ya no queda ningun delimitador: se corta en un espacio
              // para no partir una palabra por la mitad
              const espacio = texto.lastIndexOf(" ", fin);
              if (espacio > inicio) {
                fin = espacio + 1;
              } else {
                // la palabra sola ya pasa del limite: se deja entera
                const adelante = texto.indexOf(" ", fin);
                fin = adelante === -1 ? texto.length : adelante + 1;
              }
            }
          }

          parrafos.push(texto.substring(inicio, fin));
          inicio = fin;
        }

        return parrafos.map((parrafo) => parrafo.trim()).filter(Boolean);
      };

      const escapar = (texto) =>
        texto.replace(
          /[&<>]/g,
          (caracter) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[caracter])
        );

      // el texto se queda sin ningun formato, a proposito
      const separar = () => {
        const parrafos = separarPorDelimitadores(
          quitarSaltos(formatter.innerText),
          prefs.maxChar ?? MAX_CHAR_DEF
        );
        if (!parrafos.length) return;

        // el div vacio entre parrafos es la linea en blanco; va como
        // separador para que no quede una sobrante al final
        const html = parrafos
          .map((parrafo) => "<div>" + escapar(parrafo) + "</div>")
          .join("<div><br></div>");

        // Se asigna directamente. Con execCommand("insertHTML") el
        // navegador reaplicaba al texto insertado el estilo de lo que
        // reemplazaba y lo dejaba todo en negrita.
        deshacerSeparar = formatter.innerHTML;
        formatter.innerHTML = html;

        yaSeparado = true;
        aplicar();
      };

      document.getElementById("separar").addEventListener("click", separar);

      formatter.addEventListener("input", () => {
        deshacerSeparar = null;
      });

      // arrastrar solo mueve el numero; al soltar se vuelve a repartir
      deslizador.addEventListener("input", () => fijarMaxChar(deslizador.value));
      deslizador.addEventListener("change", () => {
        guardar();
        if (yaSeparado) separar();
      });

      valorMaxChar.addEventListener("dblclick", () => {
        fijarMaxChar(MAX_CHAR_DEF);
        guardar();
        if (yaSeparado) separar();
      });

      // --- Temas ---
      // Cada tema define solo pagina, hoja y texto; el borde, el asa y
      // la seleccion salen de mezclar texto con hoja, asi cualquier
      // paleta (incluida la tuya) queda coherente sin elegir 6 colores.
      const TEMAS = [
        { id: "papel", nombre: "Papel", pagina: "#f1f0ea", hoja: "#faf9f5", texto: "#2e2e2e", oscuro: false, par: "noche" },
        { id: "sepia", nombre: "Sepia", pagina: "#e8ddc7", hoja: "#f4ecd8", texto: "#4a3b28", oscuro: false, par: "ambar" },
        { id: "gris", nombre: "Gris", pagina: "#e3e6e8", hoja: "#eef0f2", texto: "#31363b", oscuro: false, par: "pizarra" },
        { id: "noche", nombre: "Noche", pagina: "#141617", hoja: "#1c1e20", texto: "#d9d7d2", oscuro: true, par: "papel" },
        { id: "ambar", nombre: "Ámbar", pagina: "#17130d", hoja: "#201b13", texto: "#e2cfab", oscuro: true, par: "sepia" },
        { id: "pizarra", nombre: "Pizarra", pagina: "#131619", hoja: "#1b1f24", texto: "#ccd3da", oscuro: true, par: "gris" },
      ];

      const canal = (color, indice) =>
        parseInt(color.slice(1 + indice * 2, 3 + indice * 2), 16);

      const mezclar = (colorA, colorB, proporcion) =>
        "#" +
        [0, 1, 2]
          .map((i) =>
            Math.round(
              canal(colorA, i) * proporcion + canal(colorB, i) * (1 - proporcion)
            )
              .toString(16)
              .padStart(2, "0")
          )
          .join("");

      // luminancia relativa (WCAG) para decidir si una paleta propia es
      // oscura, y ajustar color-scheme sin preguntarlo
      const esOscuro = (color) => {
        const lineal = (c) =>
          c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
        const luz =
          0.2126 * lineal(canal(color, 0) / 255) +
          0.7152 * lineal(canal(color, 1) / 255) +
          0.0722 * lineal(canal(color, 2) / 255);
        return luz < 0.35;
      };

      const temaActual = () => {
        if (prefs.tema === "custom" && prefs.custom) {
          return {
            ...prefs.custom,
            id: "custom",
            oscuro: esOscuro(prefs.custom.hoja),
          };
        }
        return TEMAS.find((tema) => tema.id === prefs.tema) || TEMAS[0];
      };

      const pintarPaleta = () => {
        const tema = temaActual();
        const raiz = document.documentElement.style;

        raiz.setProperty("--pagina", tema.pagina);
        raiz.setProperty("--hoja", tema.hoja);
        raiz.setProperty("--texto", tema.texto);
        raiz.setProperty("--borde", mezclar(tema.texto, tema.hoja, 0.16));
        raiz.setProperty("--asa", mezclar(tema.texto, tema.hoja, 0.3));
        raiz.setProperty("--seleccion", mezclar(tema.texto, tema.hoja, 0.22));

        document.body.style.colorScheme = tema.oscuro ? "dark" : "light";
        botonTema.textContent = tema.oscuro ? "☀️" : "🌙";

        document.querySelectorAll(".muestra").forEach((muestra) => {
          muestra.setAttribute(
            "aria-pressed",
            String(muestra.dataset.tema === tema.id)
          );
        });

        entradas.pagina.value = tema.pagina;
        entradas.hoja.value = tema.hoja;
        entradas.texto.value = tema.texto;
      };

      const muestrario = document.getElementById("muestras");
      TEMAS.forEach((tema) => {
        const muestra = document.createElement("button");
        muestra.type = "button";
        muestra.className = "muestra";
        muestra.dataset.tema = tema.id;
        muestra.title = tema.nombre;
        muestra.textContent = "Aa";
        muestra.style.backgroundColor = tema.hoja;
        muestra.style.color = tema.texto;
        muestra.addEventListener("click", () => {
          prefs.tema = tema.id;
          pintarPaleta();
        pintarNotas();
        // solo si difiere: reasignar el value mueve el cursor al final
        const texto = prefs.textoNotas || "";
        if (areaNotas.value !== texto) areaNotas.value = texto;
          guardar();
        });
        muestrario.appendChild(muestra);
      });

      // tocar cualquier color parte del tema activo y crea el propio
      Object.entries(entradas).forEach(([clave, entrada]) => {
        entrada.addEventListener("input", () => {
          const base = temaActual();
          prefs.custom = {
            pagina: base.pagina,
            hoja: base.hoja,
            texto: base.texto,
            [clave]: entrada.value,
          };
          prefs.tema = "custom";
          pintarPaleta();
        pintarNotas();
        // solo si difiere: reasignar el value mueve el cursor al final
        const texto = prefs.textoNotas || "";
        if (areaNotas.value !== texto) areaNotas.value = texto;
          guardar();
        });
      });

      document.getElementById("paleta").addEventListener("click", (event) => {
        event.stopPropagation();
        panel.hidden = !panel.hidden;
      });

      document.addEventListener("click", (event) => {
        if (!panel.hidden && !panel.contains(event.target)) panel.hidden = true;
      });

      const alternarNotas = () => {
        prefs.notasAbiertas = !prefs.notasAbiertas;

        pintarNotas();
        Object.values(PANELES).forEach((panel) =>
          fijarDesplazamiento(panel, ajustes(panel).desplazamiento || 0)
        );
        if (prefs.notasAbiertas) areaNotas.focus();
        pintarModo();
        guardar();
      };

      document
        .getElementById("boton-notas")
        .addEventListener("click", alternarNotas);

      let guardadoNotas;
      areaNotas.addEventListener("input", () => {
        prefs.textoNotas = areaNotas.value;
        clearTimeout(guardadoNotas);
        guardadoNotas = setTimeout(guardar, 400);
      });

      areaNotas.addEventListener("focus", pintarModo);
      areaNotas.addEventListener("blur", pintarModo);
      formatter.addEventListener("focus", pintarModo);

      // salta al tema emparejado: Papel <-> Noche, Sepia <-> Ambar...
      const alternarTema = () => {
        const tema = temaActual();
        prefs.tema = tema.par || (tema.oscuro ? "papel" : "noche");
        pintarPaleta();
        pintarNotas();
        // solo si difiere: reasignar el value mueve el cursor al final
        const texto = prefs.textoNotas || "";
        if (areaNotas.value !== texto) areaNotas.value = texto;
        guardar();
      };

      botonTema.addEventListener("click", alternarTema);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (!panel.hidden) {
            panel.hidden = true;
          } else if (document.activeElement === areaNotas) {
            // en las notas el equivalente a salir de edicion es fijarlas
            areaNotas.readOnly = !areaNotas.readOnly;
            pintarModo();
          } else {
            formatter.toggleAttribute("contenteditable");
            aplicar();
          }
        }
        if (event.key === "2" && event.metaKey) {
          event.preventDefault();
          alternarNotas();
        }
        // asignar innerHTML rompe el historial nativo, asi que el
        // deshacer de la separacion lo llevamos a mano
        if (
          (event.metaKey || event.ctrlKey) &&
          event.key.toLowerCase() === "z" &&
          !event.shiftKey &&
          deshacerSeparar !== null
        ) {
          event.preventDefault();
          formatter.innerHTML = deshacerSeparar;
          deshacerSeparar = null;
        }
        if (event.key === "1" && event.metaKey) {
          event.preventDefault();
          alternarTema();
        }
      });

      // si cambia el tamano de la ventana, se vuelve a encajar
      window.addEventListener("resize", () => {
        encajar();
        Object.values(PANELES).forEach((panel) => {
          pintarPanel(panel);
          fijarDesplazamiento(panel, ajustes(panel).desplazamiento || 0);
        });
      });

      aplicar();
      Object.values(PANELES).forEach((panel) => fijarDesplazamiento(panel, 0));
    };

    document.addEventListener("DOMContentLoaded", app);
  </script>

  <body>
    <div class="barra">
      <span class="chip" id="modo">edición</span>

      <span class="chip grupo" title="Tamaño de la letra">
        <button type="button" data-ajuste="fuente" data-paso="-1">A−</button>
        <b id="valor-fuente" title="Doble clic para restablecer">24</b>
        <button type="button" data-ajuste="fuente" data-paso="1">A+</button>
      </span>

      <span class="chip grupo" title="Espacio entre líneas">
        <button type="button" data-ajuste="interlineado" data-paso="-1">
          ↕−
        </button>
        <b id="valor-interlineado" title="Doble clic para restablecer">1.6</b>
        <button type="button" data-ajuste="interlineado" data-paso="1">↕+</button>
      </span>

      <span class="chip grupo" title="Máximo de caracteres por párrafo">
        <input
          type="range"
          id="maxChar"
          min="10"
          max="50"
          step="5"
          value="10"
        />
        <b id="valor-maxChar" title="Doble clic para restablecer">10</b>
      </span>

      <button
        class="chip"
        id="separar"
        type="button"
        title="Quita los saltos de línea y reparte el texto en párrafos cortando por puntos y comas"
      >
        ¶ separar
      </button>

      <button
        class="chip"
        id="boton-notas"
        type="button"
        title="Notas (Cmd+2)"
      >
        📝
      </button>

      <button class="chip" id="paleta" type="button" title="Colores">
        🎨
      </button>

      <button
        class="chip"
        id="tema"
        type="button"
        title="Modo oscuro (Cmd+1)"
        aria-label="Cambiar tema"
      >
        🌙
      </button>
    </div>

    <div class="panel" id="panel" hidden>
      <div class="muestras" id="muestras"></div>
      <label class="color-fila">
        <span>Página</span><input type="color" id="c-pagina" />
      </label>
      <label class="color-fila">
        <span>Hoja</span><input type="color" id="c-hoja" />
      </label>
      <label class="color-fila">
        <span>Texto</span><input type="color" id="c-texto" />
      </label>
    </div>

    <div class="fila" id="fila">
      <div class="marco" id="marco-lectura" data-panel="lectura">
        <div id="formatter" class="formatter" contenteditable="true">
          Escribe...
        </div>
        <span class="asa asa-mover" data-asa="mover" title="Mover a los lados"></span>
        <span class="asa asa-izq" data-asa="izq" title="Cambiar el ancho"></span>
        <span class="asa asa-der" data-asa="der" title="Cambiar el ancho"></span>
        <span class="asa asa-abajo" data-asa="abajo" title="Cambiar el alto"></span>
      </div>

      <div class="marco" id="marco-notas" data-panel="notas" hidden>
        <textarea id="texto-notas" class="notas" placeholder="Notas..."></textarea>
        <span class="asa asa-mover" data-asa="mover" title="Mover a los lados"></span>
        <span class="asa asa-izq" data-asa="izq" title="Cambiar el ancho"></span>
        <span class="asa asa-der" data-asa="der" title="Cambiar el ancho"></span>
        <span class="asa asa-abajo" data-asa="abajo" title="Cambiar el alto"></span>
      </div>
    </div>
  </body>
</html>
